name: Build and Push

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/health-api

jobs:
  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read PR version
        id: pr_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "pyproject.toml"
          field: "project.version"

      - name: Export main pyproject.toml
        run: git show origin/main:pyproject.toml > /tmp/main_pyproject.toml

      - name: Read main version
        id: main_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "/tmp/main_pyproject.toml"
          field: "project.version"

      - name: Check version is bumped
        run: |
          if [ "${{ steps.pr_version.outputs.value }}" = "${{ steps.main_version.outputs.value }}" ]; then
            echo "::error::Version '${{ steps.pr_version.outputs.value }}' matches main. Bump the version before merging."
            exit 1
          fi
          echo "Version bumped: ${{ steps.main_version.outputs.value }} -> ${{ steps.pr_version.outputs.value }}"

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read project version
        id: read_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: "pyproject.toml"
          field: "project.version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:latest
            ${{ env.IMAGE_PREFIX }}:${{ steps.read_version.outputs.value }}
            ${{ env.IMAGE_PREFIX }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          