services:
  influxdb:
    image: influxdb:3.9-core
    container_name: influxdb
    user: "501:20"
    ports:
      - 8181:8181
      - 443:443
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - ~/.influxdb/data:/var/lib/influxdb3/data
      - ~/.influxdb/plugins:/var/lib/influxdb3/plugins

  influxdb3-explorer:
    image: influxdata/influxdb3-ui
    container_name: influxdb3-explorer
    command: ["--mode=admin"]
    ports:
      - "8888:8888"
    volumes:
      - ~/.influxdb/docker/explorer/db:/db:rw
      - ~/.influxdb/docker/explorer/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET}
    restart: unless-stopped
    depends_on:
      - influxdb

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345" # Alloy UI
      - "4317:4317" # OTLP gRPC
    volumes:
      - ./scratch/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy