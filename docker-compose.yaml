services:
  influxdb:
    image: influxdb:3.9-core
    container_name: influxdb
    user: "501:20"
    ports:
      - 8181:8181
      - 443:443
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - ~/.influxdb/data:/var/lib/influxdb3/data
      - ~/.influxdb/plugins:/var/lib/influxdb3/plugins

  influxdb3-explorer:
    image: influxdata/influxdb3-ui
    container_name: influxdb3-explorer
    command: ["--mode=admin"]
    ports:
      - "8888:8888"
    volumes:
      - ~/.influxdb/docker/explorer/db:/db:rw
      - ~/.influxdb/docker/explorer/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET}
    restart: unless-stopped
    depends_on:
      - influxdb